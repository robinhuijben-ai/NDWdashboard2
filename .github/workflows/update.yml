name: NDW-data bijwerken

on:
  schedule:
    - cron: "*/5 * * * *"     # elke 5 minuten (GitHub start soms wat later)
  workflow_dispatch:           # handmatig starten via het tabblad Actions
  push:
    branches: [main]

permissions:
  contents: write              # 'actief houden'-commit en archief (branch 'data')
  actions: write               # oude caches opruimen
  pages: write
  id-token: write

concurrency:
  group: ndw-data
  cancel-in-progress: false

jobs:
  bijwerken:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # LET OP: 'path' moet exact gelijk zijn aan die bij "Toestand bewaren",
      # anders vindt GitHub de cache niet terug (de paden tellen mee in de sleutel).
      - name: Vorige toestand ophalen (historie, meetlocaties)
        uses: actions/cache/restore@v4
        with:
          path: |
            state
            !state/signs
          key: ndw-state-${{ github.run_id }}
          restore-keys: ndw-state-

      - name: Verkeersborden ophalen (wekelijks vernieuwd)
        uses: actions/cache/restore@v4
        with:
          path: state/signs
          key: ndw-signs-${{ github.run_id }}
          restore-keys: ndw-signs-

      - name: NDW-feeds ophalen en verwerken
        id: fetch
        env:
          RADIUS_KM: ${{ vars.RADIUS_KM || '35' }}
          HISTORY_DAYS: ${{ vars.HISTORY_DAYS || '14' }}
          LOOP_RADIUS_KM: ${{ vars.LOOP_RADIUS_KM || '15' }}
          OV_RADIUS_KM: ${{ vars.OV_RADIUS_KM || '15' }}
          OV_HISTORY_DAYS: ${{ vars.OV_HISTORY_DAYS || '3' }}
        run: |
          stamp() { python -c "import json;print(int(json.load(open('state/signs/meta.json'))['time']))" 2>/dev/null || echo none; }
          before=$(stamp)
          mkdir -p site
          cp -r web/. site/
          python fetch.py --state state --out site
          after=$(stamp)
          echo "signs_new=$([ "$before" != "$after" ] && [ "$after" != none ] && echo "$after")" >> "$GITHUB_OUTPUT"

      - name: Afgeronde dagen archiveren (branch 'data')
        if: steps.fetch.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARCHIVE_DAYS: ${{ vars.ARCHIVE_DAYS || '365' }}
          ARCHIVE_OV_DAYS: ${{ vars.ARCHIVE_OV_DAYS || '60' }}
        run: python archive.py --state state --out site

      - name: Toestand bewaren
        uses: actions/cache/save@v4
        with:
          path: |
            state
            !state/signs
          key: ndw-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Oude caches opruimen (alleen de nieuwste 3 bewaren)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list -R "${{ github.repository }}" --key ndw-state- --sort created_at --order desc --limit 100 --json id --jq '.[3:][].id' \
            | xargs -r -n1 gh cache delete -R "${{ github.repository }}" || true

      - name: Vernieuwde verkeersborden bewaren
        if: steps.fetch.outputs.signs_new != ''
        uses: actions/cache/save@v4
        with:
          path: state/signs
          key: ndw-signs-${{ steps.fetch.outputs.signs_new }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true        # bij een storing bij GitHub: hieronder nog één poging
      - name: Publiceren mislukt, na 30 seconden opnieuw
        if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Repository actief houden (anders zet GitHub de planning na 60 dagen uit)
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Planning actief houden"
            git push
          fi
